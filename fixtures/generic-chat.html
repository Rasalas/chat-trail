<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Generic Chat</title>
  </head>
  <body>
    <main class="conversation">
      <article class="message user">
        <p>User: Please explain SHA-256 briefly.</p>
      </article>
      <article class="message assistant">
        <p>Assistant: SHA-256 is a cryptographic hash function that produces a 256-bit digest.</p>
        <pre><code>sha256("hello")</code></pre>
      </article>
    </main>
  </body>
</html>
