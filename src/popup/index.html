<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Trail</title>
  </head>
  <body>
    <main class="popup-shell">
      <section class="brand">
        <a class="brand-link" href="https://chromewebstore.google.com/detail/chat-trail/bagpiboaacjkacgmejnnieikoaloeoji" target="_blank" rel="noopener noreferrer" title="Open Chat Trail in the Chrome Web Store">
          <img class="brand-mark" src="/icons/icon-32.png" alt="" />
          <span>Chat Trail</span>
        </a>
        <span id="status-dot" class="status-dot" aria-label="Status"></span>
      </section>

      <p id="status" class="status">Ready to read the active tab.</p>

      <section class="actions">
        <button id="quick-md" class="primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Quick Markdown</span>
        </button>
        <button id="open-review" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Review Export</span>
        </button>
        <button id="select-container" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
          <span>Select Container</span>
        </button>
      </section>

      <section class="privacy">
        <strong>Local-first</strong>
        <span>Runs on the current page only. No API keys, account crawl, or cookie export.</span>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
