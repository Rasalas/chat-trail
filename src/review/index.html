<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Trail Review</title>
  </head>
  <body>
    <main class="review-shell">
      <header class="topbar">
        <div class="brand-row">
          <div class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            Chat Trail
          </div>
          <div class="topbar-actions">
            <button id="refresh" class="icon" type="button" title="Refresh" aria-label="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>

            <details class="popover" id="settings-popover">
              <summary class="icon" title="Settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
              </summary>
              <div class="popover-panel">
                <h3>Extraction</h3>
                <label><input type="checkbox" data-option="useProviderCopy" /> Provider copy buttons</label>
                <p id="clipboard-note" class="option-note clipboard-note" hidden>
                  Enabled: extraction will click each assistant copy button and briefly read your
                  clipboard, then restore its previous content. DOM extraction remains the default.
                </p>
                <button id="clipboard-import" type="button">Import from clipboard</button>
                <h3>Messages</h3>
                <div class="popover-row">
                  <button id="select-all" type="button">Show all</button>
                  <button id="select-none" type="button">Remove all</button>
                </div>
                <button id="redact-now" type="button">Redact visible text</button>
              </div>
            </details>

            <details class="popover" id="export-popover">
              <summary class="icon primary" title="Export" aria-label="Export">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </summary>
              <div class="popover-panel">
                <h3>Export as</h3>
                <button type="button" data-export="md" class="export-row">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                  Markdown
                </button>
                <button type="button" data-export="json" class="export-row">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg>
                  JSON
                </button>
                <button type="button" data-export="html" class="export-row">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                  HTML
                </button>
                <button type="button" data-export="print" class="export-row">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                  Print / PDF
                </button>
                <button type="button" data-export="zip" class="export-row">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                  Evidence ZIP
                </button>
                <h3>Options</h3>
                <label><input type="checkbox" data-option="collapseIntermediate" checked /> Interim replies</label>
                <label><input type="checkbox" data-option="includeImages" checked /> Images</label>
                <label><input type="checkbox" data-option="includeMetadata" checked /> Metadata</label>
                <label><input type="checkbox" data-option="anonymizeUrl" /> Anonymize URL</label>
                <label><input type="checkbox" data-option="redactSecrets" checked /> Redact secrets</label>
              </div>
            </details>
          </div>
        </div>

        <div class="title-block">
          <h1 id="chat-title">Review</h1>
          <p id="summary" class="meta">Waiting for the active tab.</p>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
