<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Trail Review</title>
  </head>
  <body>
    <main class="review-shell">
      <header class="topbar">
        <div class="topbar-title">
          <h1>Review</h1>
          <p id="summary" class="summary">Waiting for the active tab.</p>
        </div>
        <div class="export-actions">
          <button id="refresh" type="button">Refresh</button>
          <button id="export-md" type="button">Markdown</button>
          <button id="export-json" type="button">JSON</button>
          <button id="export-html" type="button">HTML</button>
          <button id="print-pdf" type="button">Print/PDF</button>
          <button id="export-zip" class="primary" type="button">Evidence ZIP</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="options" aria-label="Export options">
          <label title="Extra assistant segments within one answer are kept collapsed as “previous messages”. Uncheck to remove them entirely.">
            <input type="checkbox" data-option="collapseIntermediate" checked /> Interim replies
          </label>
          <label><input type="checkbox" data-option="includeImages" checked /> Images</label>
          <label><input type="checkbox" data-option="includeMetadata" checked /> Metadata</label>
          <label><input type="checkbox" data-option="anonymizeUrl" /> Anonymize URL</label>
          <label><input type="checkbox" data-option="redactSecrets" checked /> Redact secrets</label>
          <label><input type="checkbox" data-option="useProviderCopy" /> Provider copy buttons</label>
          <p id="clipboard-note" class="option-note clipboard-note" hidden>
            Enabled: extraction will click each assistant copy button and briefly read your
            clipboard, then restore its previous content. DOM extraction remains the default.
          </p>
          <div class="option-buttons">
            <button id="select-all" type="button">Show all</button>
            <button id="select-none" type="button">Remove all</button>
            <button id="redact-now" type="button">Redact</button>
            <button id="clipboard-import" type="button">Clipboard</button>
          </div>
        </aside>

        <section class="messages" id="messages" aria-live="polite"></section>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
